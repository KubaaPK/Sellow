name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Sellow.slnx

      - name: Check formatting
        run: dotnet format Sellow.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Sellow.slnx --configuration Release --no-restore

  frontend:
  name: Frontend
  runs-on: ubuntu-latest
  timeout-minutes: 10

  defaults:
    run:
      working-directory: src/frontend

  steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        package_json_file: src/frontend/package.json
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: src/frontend/.node-version
        cache: pnpm
        cache-dependency-path: src/frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check formatting
      run: pnpm format:check

    - name: Build
      run: pnpm build

    - name: Test
      run: pnpm test -- --watch=false
