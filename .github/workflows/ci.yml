name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sellow.slnx

      - name: Check formatting
        run: dotnet format Sellow.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Sellow.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Sellow.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFilePrefix=test-results"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
